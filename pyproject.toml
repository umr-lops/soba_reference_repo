[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soba_reference_repo"
version = "0.1.0"
description = "SOBA co-aligned / TEST dataset report generator: figures, LaTeX PDF and TEST parquet"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "matplotlib",
  "geopandas",
]

[project.optional-dependencies]
docs = ["sphinx", "furo", "myst-parser"]

[project.scripts]
soba_reference_repo = "soba_reference_repo.cli:main"

[project.urls]
Repository = "https://github.com/umr-lops/soba_reference_repo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["assets", "src/soba_reference_repo/validator.py"]

[tool.ruff.lint]
select = ["E", "F", "W"]
