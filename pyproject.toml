[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soba-catalogue-report"
version = "0.1.0"
description = "SOBA co-aligned / TEST dataset report generator: figures, LaTeX PDF and TEST parquet"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "matplotlib",
  "geopandas",
]

[project.scripts]
soba-catalogue-report = "soba_catalogue_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
