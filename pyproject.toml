[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soba_reference_repo"
version = "0.2.0"
description = "Recipe-driven SOBA reference TEST/TARGET dataset exporter"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "matplotlib",
]

[project.optional-dependencies]
challenger = ["netCDF4"]
docs = ["sphinx", "furo", "myst-parser"]

[project.scripts]
soba_create_test_dataset = "soba_reference_repo.create_test_dataset:main"
soba_reference_repo = "soba_reference_repo.create_test_dataset:main"
soba_validate_parquets = "soba_reference_repo.validator:main"
soba_produce_challenger = "soba_reference_repo.challenger:main"

[project.urls]
Repository = "https://github.com/umr-lops/soba_reference_repo"

[tool.hatch.build.targets.wheel]
packages = ["src/soba_reference_repo"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "soba_reference_repo/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["assets"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Long LaTeX template lines are kept intact inside the generated report string.
"src/soba_reference_repo/hscat_test.py" = ["E501"]
