# WV altimeter curation + Curated report: 7-catalogue production shape.
#
# Covers CCI SeaState V5 (S1A/B/C) and CMEMS ALTI-L3-VAVH (S1A/B/C/D). CCI and
# CMEMS may share a satellite; the report gives each its own labelled column.
#
# This example keeps only the ``no_rain`` screen so it is self-contained. The
# production v2.0 recipe (adds ``alti_ww3_30pct``, ``cfosat_pre2024`` and
# ``hy2b_frozen_20230219`` -- the ``rel_diff_le`` / ``not_in_window_for`` clause
# types) is the file deployed with the production run; those clause types and the
# full 4-rule recipe live on the curation-filters branch. Once merged, each
# ``[[catalogues]]`` below gains the three extra rules and ``version = "2.0"``.
#
# report = true also builds the Curated document (figures + LaTeX) from the
# Curated Parquets; add compile = true for a PDF. See docs/usage.rst.
# Replace every path with a real timestamped CCI/CMEMS catalogue.
reference = "altimeter"
output_dir = "../runs/wv-alti-curation"
production_date = "20261101"
version = "1.0"
compile = false
report = true

[[catalogues]]
mission = "S1A"
path = "../data/S1A_coaligned_catalogue_WV_20150319T134347_20251231T192542_20261018T021205_SV_CCI-SEATSTATE_ALTI_L2P-V5_1.0.parquet"

[[catalogues.rules]]
id = "no_rain"
name = "IMERG rain rate == 0 mm/h"
clauses = [["imerg_rainrate", "eq", 0]]

[[catalogues]]
mission = "S1A"
path = "../data/S1A_coaligned_catalogue_WV_20191001T005910_20260629T193043_20261018T022921_SV_CMEMS-ALTI-L3-VAVH_1.0.parquet"

