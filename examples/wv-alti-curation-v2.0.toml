# WV altimeter curation v2.0: no TEST/TARGET export or report.
#
# Adds, on top of the v1.0 "no_rain" rule, three reference-quality rules:
#
# 1. alti_ww3_30pct  : reject rows where the altimeter Hs deviates by more
#                      than 30 % from the WW3 Hs (rel_diff_le).
# 2. cfosat_pre2024  : drop CFOSAT rows from 2019-01-01 up to 2024-01-01
#                      (CFOSAT commissioning period; applies to both the CCI
#                      and the CMEMS reference names).
# 3. hy2b_frozen_20230219: drop HY2B rows of 2023-02-19, when the CMEMS L3
#                      VAVH feed froze at 0.219 m for ~08:00-14:30 UTC
#                      (frozen value visible in 100 % of the 09-12 UTC file).
#
# Both new clause types were added in this release:
#   ["col", "rel_diff_le", ["ref_col", tolerance]]
#   ["col", "not_in_window_for", ["time_col", [name_patterns...], "YYYY-MM-DD", "YYYY-MM-DD"]]
#
# Replace every path with a real timestamped CCI/CMEMS catalogue. Filenames
# and coverage dates below are illustrative. Keep one input per
# satellite/product; CCI and CMEMS may share a satellite.

reference = "altimeter"
output_dir = "../runs/wv-alti-curation-2.0"
production_date = "20261101"
version = "2.0"

[[catalogues]]
mission = "S1A"
path = "../data/S1A_coaligned_catalogue_WV_20150319T134347_20251231T192542_20261018T021205_SV_CCI-SEATSTATE_ALTI_L2P-V5_1.0.parquet"

[[catalogues.rules]]
id = "no_rain"
name = "IMERG rain rate == 0 mm/h"
clauses = [["imerg_rainrate", "eq", 0]]

[[catalogues.rules]]
id = "alti_ww3_30pct"
name = "altimeter Hs within 30 % of WW3 Hs"
clauses = [["ref_hs_alti_closest", "rel_diff_le", ["ww3_swh", 0.30]]]

[[catalogues.rules]]
id = "cfosat_pre2024"
name = "no CFOSAT before 2024-01-01"
clauses = [["fname", "not_in_window_for",
            ["sar_time", ["SEASTATE-L2P-SWH-CFOSAT-", "global_vavh_l3_rt_cfo_"],
             "2019-01-01", "2024-01-01"]]]

[[catalogues.rules]]
id = "hy2b_frozen_20230219"
name = "no HY2B on 2023-02-19 (VAVH feed frozen at 0.219 m)"
clauses = [["fname", "not_in_window_for",
            ["sar_time", ["global_vavh_l3_rt_h2b_"],
             "2023-02-19", "2023-02-20"]]]

