name: Build

on:
  push:
  pull_request:

jobs:
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - run: pip install dist/*.whl
      - run: |
          python -I -c 'from soba_reference_repo.report import DEFAULT_LAND_MAP, DEFAULT_LATEX_DIR; from soba_reference_repo.swot_test import DEFAULT_SWOT_TEMPLATE; assert DEFAULT_LAND_MAP.is_file() and DEFAULT_SWOT_TEMPLATE.is_file() and all((DEFAULT_LATEX_DIR / name).is_file() for name in ("template.tex", "soba.sty", "logo_soba.png"))'
      - run: soba_reference_repo --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
