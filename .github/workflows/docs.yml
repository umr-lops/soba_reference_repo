name: Docs

on:
  push:
  pull_request:

jobs:
  sphinx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[docs]"
      - run: sphinx-build -b html -W docs docs/_build/html
      - uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
